name: Run Dream Dedup

on:
  schedule:
    - cron: '0 7,18 * * *'  # After each ingestion window
  workflow_dispatch:

jobs:
  run-dream-dedup:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke run-pipeline Edge Function (dream dedup only)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/run-pipeline" \
            -H "Content-Type: application/json" \
            -H "x-brain-key: ${{ secrets.MCP_ACCESS_KEY }}" \
            -H "x-trigger: github_actions" \
            -d '{"source": "none", "dream_dedup": true}' \
            --max-time 540)

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" = "200" ]; then
            deleted=$(echo "$body" | jq -r '.dream_dedup.deleted // 0')
            echo "::notice::Dream dedup complete: $deleted merged"
            exit 0
          fi

          echo "::error::Dream dedup failed (status: $http_code)"
          exit 1
