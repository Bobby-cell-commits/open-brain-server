name: Refresh Graph Analysis Cache

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh analysis types
        run: |
          url="${{ secrets.SUPABASE_FUNCTIONS_URL }}/refresh-graph-analysis"
          key="${{ secrets.MCP_ACCESS_KEY }}"
          succeeded=0
          failed=0
          failed_types=""

          for type in density hubs source_pairs dedup_candidates dedup_zones; do
            echo "--- Refreshing: $type ---"

            ok=false
            for attempt in 1 2 3; do
              response=$(curl -s -w "\n%{http_code}" -X POST "$url" \
                -H "Content-Type: application/json" \
                -H "x-brain-key: $key" \
                -d "{\"type\": \"$type\"}" \
                --max-time 300)

              http_code=$(echo "$response" | tail -1)
              body=$(echo "$response" | sed '$d')

              echo "  Attempt $attempt - HTTP $http_code"

              if [ "$http_code" = "200" ]; then
                errors=$(echo "$body" | jq '[.results[].results[] | select(.status == "error")] | length')
                if [ "$errors" = "0" ]; then
                  echo "  ✓ $type succeeded"
                  succeeded=$((succeeded + 1))
                  ok=true
                  break
                else
                  echo "  $type returned 200 but had RPC errors, retrying..."
                fi
              fi

              if [ $attempt -lt 3 ]; then
                echo "  Retrying in 30s..."
                sleep 30
              fi
            done

            if [ "$ok" = false ]; then
              echo "  ✗ $type failed after 3 attempts"
              failed=$((failed + 1))
              failed_types="$failed_types $type"
            fi
          done

          echo "::notice::Graph analysis refresh complete: $succeeded succeeded, $failed failed"

          if [ $failed -gt 0 ]; then
            echo "::warning::Failed analysis types:$failed_types"
            exit 1
          fi
