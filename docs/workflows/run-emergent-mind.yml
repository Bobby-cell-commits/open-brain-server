name: Run Emergent Mind Pipeline

on:
  schedule:
    - cron: '30 6,17 * * *'  # Both ingestion windows
  workflow_dispatch:

jobs:
  run-emergent-mind:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke run-pipeline Edge Function (Emergent Mind)
        run: |
          max_attempts=3
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))

            response=$(curl -s -w "\n%{http_code}" -X POST \
              "${{ secrets.SUPABASE_FUNCTIONS_URL }}/run-pipeline" \
              -H "Content-Type: application/json" \
              -H "x-brain-key: ${{ secrets.MCP_ACCESS_KEY }}" \
              -H "x-trigger: github_actions" \
              -d '{"source": "emergent_mind"}' \
              --max-time 540)

            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')

            echo "Attempt $attempt - HTTP Status: $http_code"
            echo "Response: $body"

            if [ "$http_code" = "200" ]; then
              captured=$(echo "$body" | jq -r '.sources.emergent_mind.captured // 0')
              failed=$(echo "$body" | jq -r '.sources.emergent_mind.failed // 0')
              filtered=$(echo "$body" | jq -r '.sources.emergent_mind.filtered // 0')
              warnings=$(echo "$body" | jq -r '.warnings // [] | join(", ")')
              echo "::notice::Emergent Mind complete: $captured captured, $filtered filtered, $failed failed"
              if [ -n "$warnings" ] && [ "$warnings" != "" ]; then
                echo "::warning::$warnings"
              fi
              exit 0
            fi

            if [ $attempt -lt $max_attempts ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done

          echo "::error::Emergent Mind pipeline failed after $max_attempts attempts (last status: $http_code)"
          exit 1
