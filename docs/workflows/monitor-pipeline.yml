name: Monitor Pipeline Health

on:
  schedule:
    - cron: '30 7,18 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check pipeline health
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/monitor-pipeline" \
            -H "Content-Type: application/json" \
            -H "x-brain-key: ${{ secrets.MCP_ACCESS_KEY }}" \
            -H "x-trigger: github_actions" \
            --max-time 60)

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Monitor endpoint failed (status: $http_code)"
            exit 1
          fi

          status=$(echo "$body" | jq -r '.status')
          alert_count=$(echo "$body" | jq -r '.alerts | length')
          alerts_sent=$(echo "$body" | jq -r '.alerts_sent')

          if [ "$status" = "critical" ]; then
            echo "::error::Pipeline health CRITICAL — $alert_count alerts ($alerts_sent Telegram alerts sent)"
          elif [ "$status" = "degraded" ]; then
            echo "::warning::Pipeline health DEGRADED — $alert_count alerts ($alerts_sent Telegram alerts sent)"
          else
            echo "::notice::Pipeline health OK"
          fi
