name: Run Co-occurrence Decay

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly, Sunday 4 AM UTC
  workflow_dispatch:

jobs:
  run-co-occurrence-decay:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke run-pipeline Edge Function (co-occurrence decay only)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/run-pipeline" \
            -H "Content-Type: application/json" \
            -H "x-brain-key: ${{ secrets.MCP_ACCESS_KEY }}" \
            -H "x-trigger: github_actions" \
            -d '{"source": "none", "co_occurrence_decay": true}' \
            --max-time 300)

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" = "200" ]; then
            decayed=$(echo "$body" | jq -r '.co_occurrence_decay.decayed // 0')
            pruned=$(echo "$body" | jq -r '.co_occurrence_decay.pruned // 0')
            capped=$(echo "$body" | jq -r '.co_occurrence_decay.capped // 0')
            echo "::notice::Co-occurrence decay: decayed=$decayed pruned=$pruned capped=$capped"
            exit 0
          fi

          echo "::error::Co-occurrence decay failed (status: $http_code)"
          exit 1
