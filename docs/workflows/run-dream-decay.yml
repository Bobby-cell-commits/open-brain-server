name: Run Dream Decay

on:
  schedule:
    - cron: '0 8 * * 0'  # Weekly, Sunday 8 AM UTC (after pipeline + dedup settle)
  workflow_dispatch:

jobs:
  run-dream-decay:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke run-pipeline Edge Function (dream decay only)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/run-pipeline" \
            -H "Content-Type: application/json" \
            -H "x-brain-key: ${{ secrets.MCP_ACCESS_KEY }}" \
            -H "x-trigger: github_actions" \
            -d '{"source": "none", "dream_decay": true}' \
            --max-time 540)

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" = "200" ]; then
            scored=$(echo "$body" | jq -r '.dream_decay.scored // 0')
            t1_archived=$(echo "$body" | jq -r '.dream_decay.tier1_archived // 0')
            t2_archived=$(echo "$body" | jq -r '.dream_decay.tier2_archived // 0')
            flagged=$(echo "$body" | jq -r '.dream_decay.tier3_flagged // 0')
            archived=$((t1_archived + t2_archived))
            echo "::notice::Dream decay: scored=$scored archived=$archived flagged=$flagged"
            exit 0
          fi

          echo "::error::Dream decay failed (status: $http_code)"
          exit 1
