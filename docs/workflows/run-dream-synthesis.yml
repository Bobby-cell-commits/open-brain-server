name: Run Dream Synthesis

on:
  schedule:
    - cron: '0 9 * * 0'  # Sunday 09:00 UTC — after dedup (08:00) and decay (08:30)
  workflow_dispatch:

jobs:
  run-dream-synthesis:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke run-pipeline Edge Function (dream synthesis only)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/run-pipeline" \
            -H "Content-Type: application/json" \
            -H "x-brain-key: ${{ secrets.MCP_ACCESS_KEY }}" \
            -H "x-trigger: github_actions" \
            -d '{"source": "none", "dream_synthesis": true}' \
            --max-time 540)

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" = "200" ]; then
            synthesized=$(echo "$body" | jq -r '.dream_synthesis.clusters_synthesized // 0')
            found=$(echo "$body" | jq -r '.dream_synthesis.clusters_found // 0')
            echo "::notice::Dream synthesis complete: $synthesized/$found clusters synthesized"
            exit 0
          fi

          echo "::error::Dream synthesis failed (status: $http_code)"
          exit 1
