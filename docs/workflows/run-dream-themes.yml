name: Run Dream Themes

on:
  schedule:
    - cron: '30 8 * * 0'  # Weekly, Sunday 8:30 AM UTC (after decay at 8:00)
  workflow_dispatch:

jobs:
  run-dream-themes:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke run-pipeline Edge Function (dream themes only)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/run-pipeline" \
            -H "Content-Type: application/json" \
            -H "x-brain-key: ${{ secrets.MCP_ACCESS_KEY }}" \
            -H "x-trigger: github_actions" \
            -d '{"source": "none", "dream_themes": true}' \
            --max-time 300)

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" = "200" ]; then
            processed=$(echo "$body" | jq -r '.dream_themes.themes_processed // 0')
            assigned=$(echo "$body" | jq -r '.dream_themes.thoughts_assigned // 0')
            transitions=$(echo "$body" | jq -r '.dream_themes.transitions | length // 0')
            echo "::notice::Dream themes: processed=$processed assigned=$assigned transitions=$transitions"
            exit 0
          fi

          echo "::error::Dream themes failed (status: $http_code)"
          exit 1
